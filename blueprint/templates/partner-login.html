<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partner Login | Calauan Tourism</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='partner-login.css') }}">
</head>
<body>

  <!-- Icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  </svg>

  <!-- ================= LOGIN ================= -->
  <main class="auth">
    <section class="card">
      <div class="logo"><svg class="ic"><use href="#i-briefcase"/></svg></div>
      <h1>Partner Portal</h1>
      <p class="hint">Log in to manage your establishment.</p>

      <p class="msg" id="loginMsg" hidden></p>

      <form id="loginForm" action="{{ url_for('partner.login') }}" method="post" novalidate>
        <div class="fg">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="fg">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>

      <p class="alt">Don't have an account? <button type="button" class="link" id="openRegister">Register</button></p>
      <a class="back" href="{{ url_for('user.establishments') }}"><svg class="ic"><use href="#i-back"/></svg>Back to website</a>
    </section>
  </main>

  <!-- ================= REGISTRATION MODAL ================= -->
  <div class="modal" id="registerModal" role="dialog" aria-modal="true" aria-labelledby="regTitle">
    <div class="modal-box">
      <button type="button" class="x" id="closeRegister" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button>
      <div class="logo sm"><svg class="ic"><use href="#i-briefcase"/></svg></div>
      <h3 id="regTitle">Become a Partner</h3>
      <p class="hint">Your registration will be reviewed by an admin before you can log in.</p>

      <p class="msg error" id="regMsg" hidden></p>

      <form id="registerForm" action="{{ url_for('partner.register') }}" method="post" novalidate>
        <div class="two-col">
          <div class="fg">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" placeholder="Juan Dela Cruz" maxlength="100" autocomplete="name" required>
          </div>
          <div class="fg">
            <label for="reg_email">Email</label>
            <input type="email" id="reg_email" name="email" placeholder="you@example.com" maxlength="120" autocomplete="email" required>
          </div>
        </div>

        <div class="fg">
          <label for="business_name">Business Name</label>
          <input type="text" id="business_name" name="business_name" placeholder="e.g. Calauan Farm Resort" maxlength="150" required>
        </div>

        <div class="two-col">
          <div class="fg">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="">Select...</option>
              <option>Resort</option>
              <option>Restaurant</option>
              <option>Cafe</option>
              <option>Hotel / Lodging</option>
              <option>Farm / Agri-tourism</option>
              <option>Other</option>
            </select>
          </div>
          <div class="fg">
            <label for="contact">Contact Number</label>
            <input type="text" id="contact" name="contact" placeholder="09xx xxx xxxx" maxlength="50" autocomplete="tel" required>
          </div>
        </div>

        <div class="fg">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" placeholder="Barangay, Calauan, Laguna" maxlength="255" required>
        </div>

        <div class="two-col">
          <div class="fg">
            <label for="reg_password">Password</label>
            <input type="password" id="reg_password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required>
          </div>
          <div class="fg">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat" autocomplete="new-password" required>
          </div>
        </div>

        <div class="row">
          <button type="button" class="btn ghost" id="cancelRegister">Cancel</button>
          <button type="submit" class="btn">Register</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='partner-login.js') }}"></script>
</body>
</html>
