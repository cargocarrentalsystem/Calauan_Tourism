<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Calauan Tourism</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin-login.css') }}">
</head>
<body>

  <!-- Icons (defined once, used via <use>) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></symbol>
  </svg>

  <div class="bg"></div>

  <div class="wrap">
    <section class="hero">
      <span class="tag">ADMIN PORTAL</span>
      <h1>Calauan Tourism</h1>
      <p class="lead">Manage destinations, partners, and bookings in Calauan, Laguna.</p>
    </section>

    <!-- Login form -->
    <form class="card stagger" id="loginForm" novalidate>
      <div class="logo"><svg class="ic"><use href="#i-shield"/></svg></div>
      <h2>Welcome Back</h2>
      <p class="sub">Log in to access the admin dashboard.</p>
      <div id="msg" class="msg" hidden></div>

      <div class="field">
        <svg class="ic"><use href="#i-mail"/></svg>
        <input type="email" name="email" id="email" placeholder="Email" autocomplete="username">
      </div>

      <div class="field">
        <svg class="ic"><use href="#i-lock"/></svg>
        <input type="password" name="password" id="password" placeholder="Password" autocomplete="current-password">
        <button type="button" class="eye" data-target="password" aria-label="Show password"><svg class="ic"><use href="#i-eye"/></svg></button>
      </div>

      <button class="btn" id="btnLogin">Login</button>
      <a href="#" id="linkForgot" class="forgot">Forgot password?</a>
    </form>
  </div>

  <!-- Modal 1: enter email -->
  <div class="modal" id="emailModal">
    <form class="modal-box" id="emailForm" data-url="{{ url_for('admin.forgot_send') }}" novalidate>
      <div class="logo sm"><svg class="ic"><use href="#i-mail"/></svg></div>
      <h3>Forgot Password</h3>
      <p class="hint">Enter your admin account email. We'll send you a 6-digit code.</p>
      <div class="msg" id="fp_msg1" hidden></div>
      <div class="field">
        <svg class="ic"><use href="#i-mail"/></svg>
        <input type="email" id="fp_email" placeholder="Admin email">
      </div>
      <div class="row">
        <button type="button" class="btn ghost" id="cancel1">Cancel</button>
        <button class="btn" id="btnSend">Send Code</button>
      </div>
    </form>
  </div>

  <!-- Modal 2: code and new password -->
  <div class="modal" id="resetModal">
    <form class="modal-box" id="resetForm" data-url="{{ url_for('admin.forgot_reset') }}" novalidate>
      <div class="logo sm"><svg class="ic"><use href="#i-shield"/></svg></div>
      <h3>Reset Password</h3>
      <p class="hint" id="sentTo"></p>

      <div class="timer" id="timer">
        <div class="timer-top"><span id="timerLabel">Code expires in</span><b id="countdown">10:00</b></div>
        <div class="bar"><i id="barFill"></i></div>
      </div>

      <div class="msg" id="fp_msg2" hidden></div>

      <div class="field">
        <svg class="ic"><use href="#i-shield"/></svg>
        <input id="fp_code" name="code" class="code" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
      </div>
      <div class="field">
        <svg class="ic"><use href="#i-lock"/></svg>
        <input type="password" id="fp_new" name="new_password" placeholder="New password" autocomplete="new-password">
        <button type="button" class="eye" data-target="fp_new" aria-label="Show"><svg class="ic"><use href="#i-eye"/></svg></button>
      </div>
      <div class="field">
        <svg class="ic"><use href="#i-lock"/></svg>
        <input type="password" id="fp_confirm" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password">
        <button type="button" class="eye" data-target="fp_confirm" aria-label="Show"><svg class="ic"><use href="#i-eye"/></svg></button>
      </div>

      <div class="row">
        <button type="button" class="btn ghost" id="cancel2">Cancel</button>
        <button class="btn" id="btnReset">Reset</button>
      </div>
      <button type="button" class="link" id="linkResend">Resend code</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='admin-login.js') }}"></script>
</body>
</html>
